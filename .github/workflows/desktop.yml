# Builds the desktop app on demand and uploads it to the Cloudflare R2 bucket behind the downloads
# host (installers first, then the latest*.yml update files). Nothing is published as a GitHub
# Release. The files are also kept as workflow artifacts. See DEPLOY.md.
name: Desktop app
on:
  workflow_dispatch:
    inputs:
      update_url:
        description: Where installers and latest*.yml will be hosted
        default: https://downloads.doodlehive.net
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: build:win
          - os: macos-latest
            cmd: build:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run: { working-directory: desktop }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      # Optional Mac signing: a Developer ID .p12 as base64 and its password, plus Apple ID details for
      # notarization. An empty CSC_LINK makes electron-builder look for a certificate file, so the
      # variables are only set when the secrets exist; otherwise signing is switched off.
      - name: Signing secrets, when set
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          PW: ${{ secrets.MAC_CERT_PASSWORD }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$P12" ]; then
            { echo "CSC_LINK<<EOF"; echo "$P12"; echo "EOF"; echo "CSC_KEY_PASSWORD=$PW"; } >> "$GITHUB_ENV"
            if [ -n "$AID" ]; then { echo "APPLE_ID=$AID"; echo "APPLE_APP_SPECIFIC_PASSWORD=$APW"; echo "APPLE_TEAM_ID=$TEAM"; echo "NOTARIZE=1"; } >> "$GITHUB_ENV"; fi
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
      - name: Point the updater at the downloads host
        run: node -e "const f='package.json',p=require('./'+f);p.build.publish[0].url=process.env.URL;p.build.mac.notarize=!!process.env.NOTARIZE;require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
        env: { URL: "${{ github.event.inputs.update_url }}" }
      - run: npm run ${{ matrix.cmd }}
      - name: Upload to R2
        if: env.R2_ACCESS_KEY_ID != ''
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -e
          cd dist
          # Installers and blockmaps first, so the feed never points at a file that isn't there yet.
          for f in *.exe *.dmg *.zip *.blockmap; do
            [ -e "$f" ] || continue
            aws s3 cp "$f" "s3://$R2_BUCKET/$f" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done
          for f in *.yml; do
            [ -e "$f" ] || continue
            aws s3 cp "$f" "s3://$R2_BUCKET/$f" --endpoint-url "$R2_ENDPOINT" --only-show-errors --content-type text/yaml --cache-control no-cache
          done
      - uses: actions/upload-artifact@v4
        with:
          name: doodlehive-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
