name: Server image

# Builds the production image on every push to main and pushes it to GitHub's registry (private),
# so Railway can run it without building anything itself. With RAILWAY_TOKEN and RAILWAY_SERVICE
# set, Railway is told to redeploy the new image.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/doodlehive:latest
            ghcr.io/${{ github.repository_owner }}/doodlehive:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Redeploy on Railway
        if: env.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: npx -y @railway/cli@4 redeploy --service "$RAILWAY_SERVICE" -y
